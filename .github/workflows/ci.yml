name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # GTK 3 headers for the settings window (dockling-settings).
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release --no-default-features
      - run: cargo build --release

  # Same build as the README's "From source" steps, on the target system.
  debian:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev git libgtk-3-dev pkgconf
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
