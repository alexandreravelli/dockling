[package]
name = "dockling"
version = "0.3.1"
edition = "2024"
rust-version = "1.92"
description = "An ultra-lightweight, Ubuntu-style application dock for X11 desktops such as XFCE"
license = "MIT"
readme = "README.md"
repository = "https://github.com/alexandreravelli/dockling"
homepage = "https://github.com/alexandreravelli/dockling"
keywords = ["dock", "x11", "xfce", "launcher", "taskbar"]
categories = ["gui"]
documentation = "https://docs.rs/dockling"
# What crates.io gets: the sources, the tests and the files the build or the Makefile use.
include = [
    "/src",
    "/tests",
    "/config/default.toml",
    "/data",
    "/docs/logo.svg",
    "/Makefile",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[features]
default = ["svg", "settings"]
# SVG icon support (most icon themes ship SVGs). Disable for an even smaller binary.
svg = ["dep:resvg"]
# The `dockling-settings` window (GTK 3, already present on XFCE desktops).
settings = ["dep:gtk"]

# docs.rs documents the library, which needs neither GTK nor X11.
[package.metadata.docs.rs]
no-default-features = true
features = ["svg"]

[[bin]]
name = "dockling"
path = "src/main.rs"

[[bin]]
name = "dockling-settings"
path = "src/bin/dockling-settings.rs"
required-features = ["settings"]

[dependencies]
anyhow = "1"
gtk = { version = "0.19", optional = true, features = ["v3_24"] }
resvg = { version = "0.48", default-features = false, optional = true }
rustix = { version = "1", default-features = false, features = ["std", "event"] }
serde = { version = "1", features = ["derive"] }
skrifa = { version = "0.48", default-features = false, features = ["std"] }
thiserror = "2"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
x11rb = { version = "0.14", features = ["randr", "image"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The dock converts between X11's i16/u16, pixel i32/u32 and tiny-skia's f32 all the time.
# Screen coordinates and sizes stay far inside every one of these ranges, and checked
# conversions at each step would hide the drawing code.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# x, y, w, h, r, g, b are the clearest names in drawing code.
many_single_char_names = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "alexandreravelli"
section = "x11"
priority = "optional"
depends = "$auto"
recommends = "fonts-dejavu-core"
suggests = "xfce4-appfinder"
extended-description = """\
Dockling is an ultra-lightweight, Ubuntu-style application dock for X11 desktops \
such as XFCE. It pins launchers, shows running applications with indicators, \
reserves screen space, and is configured from a small settings window \
(dockling-settings) or a single TOML file."""
assets = [
    ["target/release/dockling", "usr/bin/", "755"],
    ["target/release/dockling-settings", "usr/bin/", "755"],
    ["data/dockling.desktop", "etc/xdg/autostart/", "644"],
    ["data/dockling-settings.desktop", "usr/share/applications/", "644"],
    ["docs/logo.svg", "usr/share/icons/hicolor/scalable/apps/dockling.svg", "644"],
    ["config/default.toml", "usr/share/doc/dockling/config.example.toml", "644"],
    ["README.md", "usr/share/doc/dockling/", "644"],
]
