# cargo-deny: checks the dependency graph (https://embarkstudios.github.io/cargo-deny/).
# Run `cargo deny check` locally; CI runs it on every push.

[graph]
all-features = true

[advisories]
# Vulnerable, unmaintained and yanked crates fail the check. To accept one, add its id to
# `ignore` with the reason.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only, all compatible with Dockling's MIT license.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# miniz_oxide 0.8 (flate2, for SVG) and 0.9 (png): two small copies until both move on.
skip = [{ crate = "miniz_oxide@0.8", reason = "flate2 and png require different versions" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
